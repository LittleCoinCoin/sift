[package]
name = "receipt-ocr"
version = "0.1.0"
description = "Receipt OCR Pipeline"
authors = []
edition = "2021"

[lib]
name = "receipt_ocr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "receipt-ocr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
csv = "1"
anyhow = "1"
base64 = "0.22"
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_6996", "image_025", "thread_safe"] }
image = "0.25"
tempfile = "3"
urlencoding = "2"
walkdir = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
wiremock = "0.6.5"
